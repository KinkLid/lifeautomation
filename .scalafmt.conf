version = "3.11.1"
style = default

runner.dialect = scala3

maxColumn = 130

docstrings.wrap = keep
align.preset = some

newlines.source = fold
newlines.selectChains.style = unfold

danglingParentheses.callSite = true
danglingParentheses.importSite = false
danglingParentheses.defnSite = true

binPack.callSite = Never
binPack.defnSite = Never
binPack.importSelectors = fold

align.tokens = [
  {
    code = "=>"
    owners = [
      {
        regex = "Case"
      }
    ]
  }
]

rewrite.rules = [
  RedundantBraces
  RedundantParens
  SortModifiers
  PreferCurlyFors
]

rewrite.sortModifiers.order = [
  override,
  implicit,
  private,
  protected,
  final,
  sealed,
  abstract,
  lazy
]

rewrite.trailingCommas.style = never
rewrite.trailingCommas.allowFolding = true

rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.newSyntax.deprecated = true
rewrite.scala3.newSyntax.control = false

rewrite.scala3.optionalBraces.enabled = false
rewrite.scala3.optionalBraces.oldSyntaxToo = false

project.excludeFilters = [
  "scalafix/*",
  "scalafix-internal/input/*",
  "scalafix-internal/output/*"
]